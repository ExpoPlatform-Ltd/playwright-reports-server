name: Deploy to ECS (non-prod)

# Builds and deploys v6 (monorepo) from the dispatched ref. Modes:
#   deploy   - build/push/deploy v6, roll back on failure (default)
#   diagnose - only dump current service state / task logs (no build)
#   rollback - roll the service back to a task-definition revision
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy | diagnose | rollback"
        type: choice
        options: [deploy, diagnose, rollback]
        default: deploy
      rollback_to:
        description: "rollback mode: task-definition revision to roll back to"
        required: false
        default: "16"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  IMAGE_TAG: "6.0.0-${{ github.run_number }}"
  ECR_REPOSITORY: playwright-reports-server
  ECS_CLUSTER: playwright-reports-server-cluster
  ECS_SERVICE: playwright-reports-server
  TD_FAMILY: playwright-reports-server
  CONTAINER_NAME: reports
  APP_URL: https://playwright-reports.eu-west-1.ep-non-production.expoplatform.net
  AWS_ACCOUNT_ID: "933156343580"

jobs:
  deploy:
    name: Deploy Playwright Reports Server (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (v6 from the dispatched ref)
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "${ACCOUNT}" != "${AWS_ACCOUNT_ID}" ]; then
            echo "FATAL: expected AWS account ${AWS_ACCOUNT_ID} but OIDC resolved to ${ACCOUNT}"
            exit 1
          fi

      - name: Diagnose current service state
        run: |
          chmod +x deploy/scripts/*.sh
          deploy/scripts/ecs-diagnose.sh || true

      - name: Rollback
        if: ${{ github.event.inputs.mode == 'rollback' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          export TASK_DEFINITION_ARN="${TD_FAMILY}:${{ github.event.inputs.rollback_to }}"
          export ECS_CLUSTER ECS_SERVICE AWS_REGION
          deploy/scripts/ecs-rollback-service.sh

      - name: Build, push, deploy
        if: ${{ github.event.inputs.mode == 'deploy' }}
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          SCRIPTS: ${{ github.workspace }}/deploy/scripts
        run: |
          set -euo pipefail
          chmod +x "${SCRIPTS}"/*.sh

          PREVIOUS_TD=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          echo "previous task definition: ${PREVIOUS_TD}"

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          export IMAGE_URI ECS_CLUSTER ECS_SERVICE AWS_REGION APP_URL TD_FAMILY CONTAINER_NAME

          ok=1
          "${SCRIPTS}/ecs-deploy-image.sh" || ok=0
          if [ "$ok" = 1 ]; then
            "${SCRIPTS}/smoke-test.sh" || ok=0
          fi

          if [ "$ok" != 1 ]; then
            echo "::warning::deploy failed — diagnosing, then rolling back to ${PREVIOUS_TD}"
            "${SCRIPTS}/ecs-diagnose.sh" || true
            export TASK_DEFINITION_ARN="$PREVIOUS_TD"
            "${SCRIPTS}/ecs-rollback-service.sh" || echo "::error::rollback failed"
            exit 1
          fi
          echo "deploy succeeded"
